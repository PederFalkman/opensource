[build-system]
requires = ["hatchling>=1.27"]   # 1.27 added PEP 639 (SPDX `license`, `license-files`)
build-backend = "hatchling.build"

[project]
name = "energydata-kit"
dynamic = ["version"]
description = "Framework-independent quality checks for energy time-series data."
readme = "README.md"
requires-python = ">=3.11"
# Apache-2.0 granted by owner decision, 2026-10-18 (gate G2 / decision D3 in
# docs/governance/). The licence text is LICENSE at the repository root, with a
# byte-identical copy in this directory because the build only ships licence
# files from inside the package. Publication remains blocked by G7 below.
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Solid Soup Open Engineering" }]
keywords = ["energy", "time series", "data quality", "validation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
    # PyPI rejects uploads carrying this classifier. D6 approved 0.6.0 as a
    # GitHub release only, so it is back for 0.7.0 development; a release PR
    # removes it only with a new D6 approval naming that version (OSS-159).
    "Private :: Do Not Upload",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pint>=0.24",
]

[project.scripts]
energydata-kit = "energydata_kit.cli:console_main"

[project.optional-dependencies]
# Pandera checks in energydata_kit.pandera_checks. 0.24 introduced pandera.pandas.
pandera = ["pandera>=0.24"]
# Parquet input for the command line. 14.0.1 fixes CVE-2023-47248 (untrusted Parquet files).
parquet = ["pyarrow>=14.0.1"]

[dependency-groups]
dev = [
    "build>=1.2",
    "hypothesis>=6.100",
    "jsonschema>=4.18",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "pandera>=0.24",
    "pyarrow>=14.0.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/energydata_kit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/energydata_kit"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PD"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pint", "pint.*"]
ignore_missing_imports = true
