name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Third-party actions are pinned to full commit SHAs (version in the trailing
# comment); Dependabot updates both. tools/check_workflow_pins.py enforces it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ip-boundary:
    name: IP boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check imports and dependency allowlist
        run: python tools/check_ip_boundary.py
      - name: Check that GitHub Actions are pinned to commit SHAs
        run: python tools/check_workflow_pins.py
      - name: Check that the docs match the code
        run: python tools/check_docs.py
      - name: Check the third-party licence table
        run: python tools/check_third_party.py
      - name: Check that the upload guard stays until D6 is recorded
        run: python tools/check_release_readiness.py --guard
      - name: Test the checker
        run: |
          python -m pip install pytest ruff
          python -m ruff check tools
          python -m ruff format --check tools
          python -m pytest -q -p no:cacheprovider tools/tests

  energydata-kit:
    name: energydata-kit (py${{ matrix.python }}${{ matrix.lowest && ', lowest deps' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        lowest: [false]
        include:
          - python: "3.11"
            lowest: true
    defaults:
      run:
        working-directory: packages/energydata-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install -e . --group dev
      - name: Pin lowest supported runtime dependencies
        if: matrix.lowest
        # pyarrow 14.0.2: the lowest allowed (CVE fix in 14.0.1) that still works with NumPy 1.26.
        # pandera 0.24 passes index checks their timestamps differently from later versions.
        run: python -m pip install "numpy==1.26.*" "pandas==2.1.*" "pint==0.24.*" "pyarrow==14.0.2" "pandera==0.24.*"
      - name: Ruff
        if: ${{ !matrix.lowest }}
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Mypy
        if: ${{ !matrix.lowest }}
        run: python -m mypy
      - name: Pytest
        run: python -m pytest

  energydata-kit-os:
    # Lint and types do not depend on the OS, so only the tests run here.
    # They include the golden reports, which must be byte-identical on every
    # platform.
    name: energydata-kit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: packages/energydata-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install -e . --group dev
      - name: Pytest
        run: python -m pytest

  energydata-kit-package:
    name: energydata-kit packaging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/energydata-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "energydata_kit/py.typed" in names, names
          assert "energydata_kit/report_schema.json" in names, names
          assert not any(n.startswith("tests/") for n in names), names
          print("\n".join(sorted(names)))
          PY
      - name: Test the installed wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install dist/*.whl pytest
          /tmp/wheel-env/bin/energydata-kit --version
          mkdir -p /tmp/wheel-test && cp -r tests examples /tmp/wheel-test/
          cd /tmp/wheel-test
          /tmp/wheel-env/bin/python -m pytest -q -p no:cacheprovider tests

  release-dry-run:
    # Rehearses the release PR edits in a temporary copy (a placeholder licence
    # only where the repository has none; nothing committed) and builds there.
    # Nothing is uploaded: the files are deleted with the copy. See
    # tools/release_dry_run.py.
    name: Release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Rehearse the energydata-kit release
        run: |
          python -m pip install --upgrade build twine
          python tools/release_dry_run.py energydata-kit --build
