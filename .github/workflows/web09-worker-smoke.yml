name: WEB-09 browser worker pilot (targeted)

# Manual-only after verified Chromium, Firefox and WebKit parity.
# No automatic PR/push/schedule to conserve browser download costs.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Synthetic-only browser test target"
        type: choice
        options:
          - web13
          - web09
        default: web13
        required: true
      browser:
        description: 'Browser engine for synthetic-only Worker smoke'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: chromium
        required: true

permissions:
  contents: read

jobs:
  worker-smoke:
    name: Real browser synthetic worker parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install local package, wheel build and browser harness
        run: |
          set -euo pipefail
          python -m pip install -e packages/energydata-kit build playwright
          python -m playwright install --with-deps "${{ inputs.browser || 'chromium' }}"
      - name: Build local, review-only EnergyData Kit wheel
        run: python -m build --wheel packages/energydata-kit --outdir /tmp/edk-worker-wheel
      # WEB-13 adds missing/incorrect manifest pin, cancel, all four Python reference
      # comparisons and synthetic JSON export. No automatic PR/push/schedule trigger.
      - name: Test selected synthetic review target
        env:
          TEST_TARGET: ${{ inputs.target }}
          TEST_BROWSER: ${{ inputs.browser }}
        run: |
          set -euo pipefail
          wheel="$(find /tmp/edk-worker-wheel -maxdepth 1 -name 'energydata_kit-*.whl' -type f -print -quit)"
          test -n "$wheel"
          case "$TEST_TARGET" in
            web13)
              python apps/workbench/web13_browser_smoke.py --wheel "$wheel" --browser "$TEST_BROWSER" --timeout-ms 240000 --evidence-file "$RUNNER_TEMP/web13-synthetic-evidence.json"
              ;;
            web09)
              python apps/workbench/browser_worker_smoke.py --wheel "$wheel" --browser "$TEST_BROWSER" --timeout-ms 240000
              ;;
            *)
              echo "Unsupported target" >&2
              exit 2
              ;;
          esac
      - name: Summarize review-only browser evidence
        if: always()
        env:
          TEST_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "$TEST_TARGET" != "web13" ]; then
            exit 0
          fi
          if [ -s "$RUNNER_TEMP/web13-synthetic-evidence.json" ]; then
            python apps/workbench/render_web13_evidence_summary.py "$RUNNER_TEMP/web13-synthetic-evidence.json" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## WEB-13 synthetic browser smoke"
              echo "No complete evidence receipt was produced. This run is **not verified**."
              echo "Inspect the test job logs for the failure."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
