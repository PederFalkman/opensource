name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday 05:17 UTC
  workflow_dispatch:

# Actions pinned to commit SHAs; see .github/workflows/ci.yml.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The hosted GitLeaks Action requires an organization license.
      # Use the OSS CLI directly; verify its published checksum before executing.
      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --location --silent --show-error --retry 3 \
            "${base}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          curl --fail --location --silent --show-error --retry 3 \
            "${base}/gitleaks_${version}_checksums.txt" -o /tmp/gitleaks-checksums.txt
          grep -E "^[a-fA-F0-9]{64}  gitleaks_${version}_linux_x64.tar.gz$" \
            /tmp/gitleaks-checksums.txt | sed "s|gitleaks_${version}_linux_x64.tar.gz|/tmp/gitleaks.tar.gz|" \
            > /tmp/gitleaks-check.txt
          test -s /tmp/gitleaks-check.txt
          sha256sum --check /tmp/gitleaks-check.txt
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          chmod +x /tmp/gitleaks-bin/gitleaks
          /tmp/gitleaks-bin/gitleaks version
      - name: Secret scan (complete Git history)
        run: /tmp/gitleaks-bin/gitleaks git --redact --exit-code 1 --log-opts="--all" .

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/energydata-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit resolved runtime dependencies (including optional extras)
        run: |
          python -m venv /tmp/audit-env
          /tmp/audit-env/bin/python -m pip install --upgrade pip pip-audit
          /tmp/audit-env/bin/python -m pip install ".[pandera,parquet]"
          /tmp/audit-env/bin/pip-audit --skip-editable

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
