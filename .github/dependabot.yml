version: 2
updates:
  - package-ecosystem: pip
    directory: /packages/energydata-kit
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Workflows pin actions by commit SHA; Dependabot bumps the SHA and the
  # trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
